# Render Blueprint: the API. The page is on Vercel (vercel.json), so this
# service runs the Python server only and serves no HTML.
#
#   Render → New → Blueprint → this repo → fill in the prompted values → Apply.
#
# The `sync: false` values are asked for once, when the Blueprint is first
# applied, and never stored here; change them later under the service's
# Environment tab. .env.example documents every setting.
#
# Order matters once: create this first, give its address to Vercel as
# VITE_API_URL, then make sure ALLOWED_ORIGINS here is the address Vercel gave
# the page. The Dockerfile still builds the whole app as one image, for hosting
# it in one place instead.

services:
  - type: web
    name: teaching-ide-api
    runtime: python
    # Free sleeps after 15 minutes idle and takes about a minute to wake; the page
    # pings /api/health as a lesson opens, and the teacher falls back to the
    # hand-written hints until it answers. Keep it to one instance on any plan:
    # the rate limits live in memory (server/quota.py).
    plan: free
    # Fixed at creation. Singapore is the nearest to learners in India.
    region: singapore
    branch: main
    # Every push to main that touches the server goes live; page-only changes
    # are Vercel's and do not redeploy this.
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - server/**
        - requirements.txt
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn server.main:app --host 0.0.0.0 --port $PORT
    # Always 200 while the process is up, whatever the model provider is doing.
    healthCheckPath: /api/health
    envVars:
      # What the tests run on.
      - key: PYTHON_VERSION
        value: 3.13.7
      # The teacher. Swapping providers is these three; see .env.example.
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false
      # The Supabase project URL, to check sign-ins against (server/auth.py).
      - key: SUPABASE_URL
        sync: false
      # The page's address on Vercel, e.g. https://teaching-ide.vercel.app. The
      # browser refuses every reply from here to a page not listed.
      # Comma-separated if there is more than one.
      - key: ALLOWED_ORIGINS
        sync: false
      # The teacher's voice (server/tts.py). Leave it empty and every learner
      # hears the browser's own voice instead.
      - key: ELEVENLABS_API_KEY
        sync: false
      # Render's proxy is in front, so rate limits must read the forwarded address
      # or every learner shares one bucket.
      - key: TRUST_PROXY
        value: "1"
